name: kocaeli_genc_ihh_takip
description: Kocaeli Genç İHH İl Yönetim ve Faaliyet Takip Sistemi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  pdf: ^3.13.1
  printing: ^5.15.1
  url_launcher: ^6.2.5
  table_calendar: ^3.1.2
  intl: ^0.19.0
  onesignal_flutter: ^5.7.1
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
name: Kocaeli Genç İHH CI/CD (Web, APK, iOS)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web-and-apk:
    name: Web Yayını ve APK Oluşturma
    runs-on: ubuntu-latest
    
    # GitHub Pages için gerekli ortam izinleri
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Paketleri İndir
        run: flutter pub get

      - name: Web İçin Derle
        run: flutter build web --release --base-href "/Y-ll-k-Planlama/"

      - name: GitHub Pages İçin Sayfayı Yapılandır
        uses: actions/configure-pages@v4

      - name: Web Dosyalarını Yüklemeye Hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/web'

      - name: Web Sürümünü GitHub Pages'e Yayınla
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Android APK Derle
        run: flutter build apk --release

      - name: APK Dosyasını Kaydet (Artifact Olarak)
        uses: actions/upload-artifact@v4
        with:
          name: GencIHH-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: iOS Derlemesi ve IPA Üretimi
    runs-on: macos-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Paketleri İndir
        run: flutter pub get

      - name: iOS İçin Derle (Sertifikasız)
        run: flutter build ios --release --no-codesign

      - name: IPA Dosyasını Paketle
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r GencIHH.ipa Payload
          cd ../../..

      - name: IPA Dosyasını Kaydet (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GencIHH-IPA
          path: build/ios/iphoneos/GencIHH.ipa